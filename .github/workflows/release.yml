name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run release in dry-run mode (no publishing)'
        required: false
        default: false
        type: boolean

jobs:
  # Call the commit workflow to run all tests and linting
  run-tests:
    uses: ./.github/workflows/commit.yml

  release:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    needs:
    - run-tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}
    - name: Configure Git
      run: |
        # $GITHUB_WORKSPACE, not a hard-coded path. This said /__w/spectral/spectral,
        # which is the UPSTREAM repository's checkout path. In this fork the workspace is
        # /__w/spotlight-tools/spotlight-tools, so the exception was being granted to a
        # directory that does not exist and git would have refused the real one as
        # dubiously owned. commit.yml and upstream-watch.yml were already fixed this way;
        # release.yml is the one workflow nobody has run, so nothing caught it.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Set up NPM auth
      run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Build
      run: yarn build
    - name: Release
      run: yarn release
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
