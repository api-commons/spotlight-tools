name: test-harness
description: 'Run tests.'
inputs:
  os:
    description: 'Operating system to run the tests on (linux, windows, macos)'
    required: true
  node-version:
    description: 'Node.js version to run the tests with'
    required: true
runs:
  using: composite
  steps:
  - name: restore_cache
    uses: actions/cache@v4.3.0
    with:
      key: test-harness-${{ inputs.os }}-${{ inputs.node-version }}-${{ github.sha }}
      path: |-
        ./.cache/spectral-test-harness
        ./test-harness/tests/
      restore-keys: |-
        test-harness-${{ inputs.os }}-${{ inputs.node-version }}-
  - uses: "./.github/actions/build-binary"
    with:
      targets: "${{ inputs.os }}"
      node-version: "${{ inputs.node-version }}"
      bytecode: 'false'
  - name: Run harness tests Windows
    if: ${{ inputs.os == 'windows' }}
    run: yarn test.harness --maxWorkers=3
    shell: pwsh
  - name: save_cache
    uses: actions/cache@v4.3.0
    with:
      path: |-
        ./.cache/spectral-test-harness
        ./test-harness/tests/
      key: test-harness-${{ inputs.os }}-${{ inputs.node-version }}-${{ github.sha }}